<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b3b98">
<title>闯关挑战</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #6a5cff 0%, #3b3b98 45%, #2b2b6b 100%);
    min-height: 100vh;
    padding: 24px 12px 48px;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    color: #fff;
  }
  .app { width: 100%; max-width: 440px; margin: 0 auto; }
  .stage { display: none; }
  .stage.active { display: block; animation: fade .4s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px);} to { opacity:1; transform:none;} }
  .card {
    background: #fff; color: #1f2333; border-radius: 20px;
    padding: 22px 16px; box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .title { font-size: 21px; font-weight: 700; text-align:center; }
  .sub { font-size: 13px; color:#8a8fa3; text-align:center; margin: 6px 0 16px; }

  .ref { display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:14px; }
  .ref-img { width: 56px; height:56px; border-radius:10px; object-fit:cover; border:2px solid #e5e7f2; }
  .ref span { font-size:12px; color:#8a8fa3; }

  .puzzle {
    position: relative; width:100%; aspect-ratio:1/1; border-radius:14px;
    overflow:hidden; background:#11142a; touch-action:none;
  }
  .tile {
    position:absolute; top:0; left:0; width:33.3333%; height:33.3333%;
    background-size: 300% 300%; background-repeat:no-repeat;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.6);
    transition:none; cursor:pointer;
  }
  .puzzle.ready .tile { transition: transform .18s ease; }
  .tile.empty { background:none; box-shadow:none; background-color:rgba(255,255,255,.05); }

  .ghost {
    display:block; margin:16px auto 0; padding:10px 22px; border-radius:999px;
    border:1px solid #d8dbec; background:#f4f5fb; color:#4a4f66; font-size:14px;
  }
  .ghost:active { background:#e8eaf6; }

  .media { width:100%; border-radius:14px; display:block; background:#eef0f8; }

  .field { margin-top:16px; }
  .field label { font-size:13px; color:#8a8fa3; display:block; margin-bottom:8px; text-align:center; }
  .row { display:flex; gap:10px; }
  .num {
    flex:1; min-width:0; font-size:22px; text-align:center; padding:12px; border-radius:12px;
    border:2px solid #e1e4f0; outline:none; font-weight:700; letter-spacing:2px;
    color:#1f2333;
  }
  .num:focus { border-color:#6a5cff; }
  .btn {
    padding:0 26px; border:none; border-radius:12px; background:linear-gradient(135deg,#6a5cff,#5a4be0);
    color:#fff; font-size:16px; font-weight:700;
  }
  .btn:active { opacity:.85; }
  .err { color:#e5484d; font-size:13px; text-align:center; margin-top:10px; min-height:18px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }

  .overlay {
    position:fixed; inset:0; background:rgba(10,12,30,.72); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .overlay.show { display:flex; animation:fade .25s ease; }
  .dialog { background:#fff; color:#1f2333; border-radius:20px; padding:28px 24px; text-align:center; width:100%; max-width:320px; }
  .dialog .emoji { font-size:48px; }
  .dialog h2 { font-size:20px; margin:10px 0 6px; }
  .dialog p { font-size:14px; color:#8a8fa3; margin-bottom:18px; }
  .primary { background:linear-gradient(135deg,#07c160,#05a94f); color:#fff; border:none; padding:12px 30px; border-radius:999px; font-size:16px; font-weight:700; }
  .primary:active { opacity:.85; }

  .badge { text-align:center; margin-top:16px; font-size:14px; color:#2b2b6b; }
  .badge .done { font-size:28px; }

  .start-overlay {
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;
    background: linear-gradient(160deg, #6a5cff 0%, #3b3b98 45%, #2b2b6b 100%);
    transition: opacity .5s ease;
  }
  .start-overlay.hidden { opacity:0; pointer-events:none; }
  .start-box { text-align:center; color:#fff; }
  .start-note { font-size:46px; }
  .start-title { font-size:28px; font-weight:800; margin:14px 0 6px; letter-spacing:2px; }
  .start-sub { font-size:14px; opacity:.9; margin-bottom:28px; }
  .start-box .primary { font-size:17px; padding:13px 46px; }
</style>
</head>
<body>
<audio id="bgm" src="music.mp3" loop preload="auto" playsinline webkit-playsinline></audio>

<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div class="start-note">🎵</div>
    <div class="start-title">闯关挑战</div>
    <div class="start-sub">点击进入，开启背景音乐</div>
    <button class="primary" id="startBtn">点击进入</button>
  </div>
</div>

<div class="app">

  <section id="stage1" class="stage active">
    <div class="card">
      <div class="title">第一关 · 拼图闯关</div>
      <div class="sub">滑动方块，拼出完整的蛋糕图</div>
      <div class="ref">
        <img class="ref-img" id="refImg" alt="参考图">
        <span>参考原图</span>
      </div>
      <div class="puzzle" id="puzzleGrid"></div>
      <button class="ghost" id="reshuffle">重新打乱</button>
    </div>
  </section>

  <section id="stage2" class="stage">
    <div class="card">
      <div class="title">第二关 · 输入密码</div>
      <div class="sub">根据图中提示，输入正确的数字密码</div>
      <img class="media" id="passwordImg" alt="密码图">
      <div class="field">
        <label>请输入数字密码</label>
        <div class="row">
          <input class="num" id="pwdInput" type="tel" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="请输入" enterkeyhint="done">
          <button class="btn" id="pwdSubmit">提交</button>
        </div>
        <div class="err" id="pwdErr"></div>
      </div>
    </div>
  </section>

  <section id="stage3" class="stage">
    <div class="card">
      <div class="title">第三关 · 位置</div>
      <div class="sub">保持此页面即可</div>
      <img class="media" id="locationImg" alt="位置图">
      <div class="badge"><div class="done">🎉</div>恭喜，全部通关！</div>
    </div>
  </section>

</div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="emoji" id="ovEmoji">🎉</div>
    <h2 id="ovTitle">通关！</h2>
    <p id="ovText">太棒了</p>
    <button class="primary" id="ovBtn">下一关</button>
  </div>
</div>

/* ---------- 通关弹窗 ---------- */
const overlay = document.getElementById('overlay');
function showDialog(emoji, title, text, btnText, onNext) {
  document.getElementById('ovEmoji').textContent = emoji;

}

/* ---------- 第一关：九宫格滑动拼图 ---------- */
const SIZE = 3, N = 9, EMPTY = 8;
let board = [];
let blankPos = EMPTY;
let solved = false;
const grid = document.getElementById('puzzleGrid');
const tiles = []; // tiles[v] = 值为 v 的方块元素

function buildTiles() {
  grid.innerHTML = '';
  for (let v = 0; v < N; v++) {
    const el = document.createElement('div');
    el.className = 'tile' + (v === EMPTY ? ' empty' : '');
    el.dataset.v = v;
    if (v !== EMPTY) {
      const r = Math.floor(v / SIZE), c = v % SIZE;
      el.style.backgroundImage = 'url(' + IMAGES.cake + ')';
      el.style.backgroundPosition = (c * 50) + '% ' + (r * 50) + '%';
    }
    grid.appendChild(el);
    tiles[v] = el;
  }
}

function posOf(v) { return board.indexOf(v); }

function layout() {
  for (let v = 0; v < N; v++) {
    const p = posOf(v);
    const r = Math.floor(p / SIZE), c = p % SIZE;
    tiles[v].style.transform = 'translate(' + (c * 100) + '%, ' + (r * 100) + '%)';
  }
}

function tryMove(pos) {
  if (solved) return false;
  const pr = Math.floor(pos / SIZE), pc = pos % SIZE;
  const br = Math.floor(blankPos / SIZE), bc = blankPos % SIZE;
  if (Math.abs(pr - br) + Math.abs(pc - bc) !== 1) return false;
  board[blankPos] = board[pos];
  board[pos] = EMPTY;
  blankPos = pos;
  return true;
}

function isSolved() {
  for (let i = 0; i < N; i++) if (board[i] !== i) return false;
  return true;
}

function shuffle() {
  board = [0,1,2,3,4,5,6,7,8];
  blankPos = EMPTY;
  for (let i = 0; i < 300; i++) {
    const br = Math.floor(blankPos / SIZE), bc = blankPos % SIZE;
    const nb = [];
    if (br > 0) nb.push(blankPos - SIZE);
    if (br < SIZE - 1) nb.push(blankPos + SIZE);
    if (bc > 0) nb.push(blankPos - 1);
    if (bc < SIZE - 1) nb.push(blankPos + 1);
    const pick = nb[Math.floor(Math.random() * nb.length)];
    board[blankPos] = board[pick];
    board[pick] = EMPTY;
    blankPos = pick;
  }
  if (isSolved()) shuffle();
  solved = false;
  layout();
}

function afterMove() {
  layout();
  if (isSolved()) {
    solved = true;
    setTimeout(function () {
      showDialog('🎉', '通关成功！', '拼图完成，进入下一关', '下一关', function () { showStage(1); });
    }, 350);
  }
}

/* 点击方块移动 */
grid.addEventListener('click', function (e) {
  if (swiped) { swiped = false; return; }
  const tile = e.target.closest('.tile');
  if (!tile || solved || tile.classList.contains('empty')) return;
  const pos = posOf(Number(tile.dataset.v));
  if (tryMove(pos)) afterMove();
});

/* 滑动方块移动 */
let sx = 0, sy = 0, swiped = false;
grid.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false; }, { passive: true });
grid.addEventListener('touchend', function (e) {
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  swiped = true;
  if (solved) return;
  const br = Math.floor(blankPos / SIZE), bc = blankPos % SIZE;
  let target = -1;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && bc > 0) target = blankPos - 1;           // 右滑：左侧方块右移
    else if (dx < 0 && bc < SIZE - 1) target = blankPos + 1; // 左滑：右侧方块左移
  } else {
    if (dy > 0 && br > 0) target = blankPos - SIZE;          // 下滑：上方方块下移
    else if (dy < 0 && br < SIZE - 1) target = blankPos + SIZE; // 上滑：下方方块上移
  }
  if (target >= 0 && tryMove(target)) afterMove();
}, { passive: true });

document.getElementById('reshuffle').addEventListener('click', shuffle);

/* ---------- 第二关：密码验证 ---------- */
const pwdInput = document.getElementById('pwdInput');
const pwdErr = document.getElementById('pwdErr');
const PASSWORD = '101';
function checkPwd() {
  const val = pwdInput.value.trim();
  if (val === PASSWORD) {
    pwdErr.textContent = '';
    showDialog('🎉', '通关成功！', '密码正确', '进入最后一关', function () { showStage(2); });
  } else {
    pwdErr.textContent = '密码错误，请重试';
    pwdInput.classList.remove('shake');
    void pwdInput.offsetWidth;
    pwdInput.classList.add('shake');
  }
}
document.getElementById('pwdSubmit').addEventListener('click', checkPwd);
pwdInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') checkPwd(); });

/* ---------- 初始化 ---------- */
buildTiles();
shuffle();
grid.classList.add('ready');
</script>
